<div class="home-container">
  <section class="hero">
    <h1>Experience <span class="gradient-text">PasagaTv</span> Anywhere</h1>
  </section>
</div>

<section class="films-section">
  <div class="films-grid">
    @for (film of films(); track film.id) {
    <div class="film-card" style="cursor: pointer;" (click)="navigateToFilmDetail(film.id)">
      <div class="poster-container">
        <img [src]="film.poster_url" [alt]="film.title" class="film-poster" />
        <div class="rating-badge" [attr.data-rating]="film.rating">{{ film.rating }}</div>
      </div>
      <div class="film-content">
        <h3 class="film-title">{{ film.title }}</h3>
        <div class="film-meta">
          <span>{{ film.year }}</span>
          <span class="dot"></span>
          <span>{{ film.genre }}</span>
          <span class="dot"></span>
          <span>{{ film.duration }} min</span>
        </div>
        <p class="film-description">{{ film.description }}</p>
        <button class="view-btn">Visualizza</button>
      </div>
    </div>
    }
  </div>

  @if (totalPages() > 1) {
  <div class="pagination">
    <button 
      class="page-btn" 
      [disabled]="currentPage() === 0" 
      (click)="onPageChange(currentPage() - 1)">
      Precedente
    </button>
    
    <span class="page-info">Pagina {{ currentPage() + 1 }} di {{ totalPages() }}</span>
    
    <button 
      class="page-btn" 
      [disabled]="currentPage() >= totalPages() - 1" 
      (click)="onPageChange(currentPage() + 1)">
      Successiva
    </button>
  </div>
  }
</section>
