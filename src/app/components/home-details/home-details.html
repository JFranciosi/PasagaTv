@if(film(); as film) {
<div class="detail-container">
    <div class="backdrop" [style.background-image]="'url(' + film.poster_url + ')'"></div>
    
    <div class="content-wrapper">
        <a routerLink="/" class="back-link">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Torna alla Home
        </a>

        <div class="main-content">
            <div class="poster-section">
                <div class="poster-card">
                    <img [src]="film.poster_url" [alt]="film.title" class="detail-poster" />
                    <span class="rating-badge" [attr.data-rating]="film.rating">{{ film.rating }}</span>
                </div>
            </div>

            <div class="info-section">
                <div class="header">
                    <span class="genre-tag">{{ film.genre }}</span>
                    <h1 class="title">{{ film.title }}</h1>
                    
                    <div class="meta">
                        <span class="meta-item">{{ film.year }}</span>
                        <span class="dot"></span>
                        <span class="meta-item">{{ film.duration }} min</span>
                        <span class="dot"></span>
                        <span class="meta-item">Regia di {{ film.director }}</span>
                    </div>
                </div>

                <div class="description-block">
                    <h2>Descrizione</h2>
                    <p>{{ film.description }}</p>
                </div>

                <div class="actions">
                    <button class="primary-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Guarda Ora
                    </button>
                    <button class="secondary-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg>
                        Aggiungi ai Preferiti
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
} @else {
<div class="loading-state">
    <div class="spinner"></div>
    <p>Caricamento film in corso...</p>
</div>
}
